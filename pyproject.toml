[project]
name = "moseq2-test"
version = "0.1.0"
description = "Installed-package and cross-pipeline regression tests for MoSeq2"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Datta Lab" }]
maintainers = [{ name = "John Jacoby" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "filelock>=3.16",
  "h5py>=3.12",
  "numpy>=2.0",
  "packaging>=24.2",
  "pandas>=2.2",
  "platformdirs>=4.3",
  "pooch>=1.8",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2",
  "requests>=2.32",
  "rich>=13.9",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
publish = ["boto3>=1.35"]
media = ["pillow>=11"]

[project.scripts]
moseq2-test = "moseq2_test.cli:app"

[project.urls]
Repository = "https://github.com/dattalab/moseq2-test"
Issues = "https://github.com/dattalab/moseq2-test/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/environments",
  "/manifests",
  "/profiles",
  "/schemas",
  "/recipes",
  "/licenses",
  "/action.yml",
  "/LICENSE.md",
  "/NOTICE.md",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moseq2_test"]
artifacts = ["src/moseq2_test/py.typed"]

[tool.hatch.build.targets.wheel.force-include]
"manifests" = "moseq2_test/resources/manifests"
"profiles" = "moseq2_test/resources/profiles"
"schemas" = "moseq2_test/resources/schemas"
"environments" = "moseq2_test/resources/environments"
"recipes" = "moseq2_test/resources/recipes"
"licenses" = "moseq2_test/resources/licenses"

[dependency-groups]
dev = [
  "build>=1.3",
  "hypothesis>=6.135",
  "jsonschema>=4.24",
  "mypy>=1.16",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moseq2_test"]
exclude = ["src/moseq2_test/workers/legacy_worker.py"]
