schema_version: 1
lock_id: moseq2-legacy-build-toolchain-linux-64-v1
platform: linux-64
purpose: >-
  Offline GCC/G++ toolchain used only to build candidate wheels. The prefix is
  separate from the frozen Python 3.7 runtime, and its ABI runtime packages are
  the exact builds already captured by the legacy environment.
compiler:
  version: 11.4.0
  cc: x86_64-conda-linux-gnu-cc
  cxx: x86_64-conda-linux-gnu-c++
build_environment:
  CPPFLAGS: -DNDEBUG -D_FORTIFY_SOURCE=2 -O2 -isystem {prefix}/include
  CFLAGS: >-
    -march=nocona -mtune=haswell -ftree-vectorize -fPIC
    -fstack-protector-strong -fno-plt -O2 -ffunction-sections -pipe
    -isystem {prefix}/include
  CXXFLAGS: >-
    -fvisibility-inlines-hidden -fmessage-length=0 -march=nocona
    -mtune=haswell -ftree-vectorize -fPIC -fstack-protector-strong
    -fno-plt -O2 -ffunction-sections -pipe -isystem {prefix}/include
  LDFLAGS: >-
    -Wl,-O2 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now
    -Wl,--disable-new-dtags -Wl,--gc-sections -Wl,--allow-shlib-undefined
    -Wl,-rpath,{prefix}/lib -Wl,-rpath-link,{prefix}/lib -L{prefix}/lib
  CMAKE_PREFIX_PATH: '{prefix}:{prefix}/x86_64-conda-linux-gnu/sysroot/usr'
  CONDA_BUILD_SYSROOT: '{prefix}/x86_64-conda-linux-gnu/sysroot'
